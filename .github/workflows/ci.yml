name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiking_ci
          POSTGRES_PASSWORD: aiking_ci_local_only
          POSTGRES_DB: aiking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiking_ci -d aiking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ROLE: api
      DATABASE_URL: postgresql://aiking_ci:aiking_ci_local_only@127.0.0.1:5432/aiking_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_DRIVER: inline
      PROVIDER_MODE: mock
      PAYMENTS_MODE: mock
      JWT_SECRET: ci-only-test-secret-not-valid-outside-ci
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply committed migrations
        run: npm run prisma:migrate

      - name: Build shared package
        run: npm run build --workspace @aiking/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test --workspace @aiking/api -- --runInBand

      - name: Build application
        run: npm run build