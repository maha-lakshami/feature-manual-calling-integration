name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiking
          POSTGRES_PASSWORD: aiking
          POSTGRES_DB: aiking
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aiking -d aiking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_ROLE: api
      DATABASE_URL: postgresql://aiking:aiking@localhost:5433/aiking?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_DRIVER: inline
      PROVIDER_MODE: mock
      PAYMENTS_MODE: mock
      JWT_SECRET: ci-only-test-secret-not-valid-outside-ci
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @aiking/shared

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test --workspace @aiking/api -- --runInBand

      - name: Build application
        run: npm run build
