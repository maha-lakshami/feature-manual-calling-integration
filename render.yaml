services:
  # ── Backend API ───────────────────────────────────────────────────────────────
  - type: web
    name: aiking-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm run prisma:migrate --workspace @aiking/api && node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: api
      - key: QUEUE_DRIVER
        value: bullmq
      - key: API_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Explicit frontend origin(s), comma-separated
      - key: DATABASE_URL
        sync: false # Paste your free Neon.tech or Supabase PostgreSQL connection URL
      - key: REDIS_URL
        sync: false # Paste the shared production Redis connection URL

  # ── Background worker (private, no HTTP listener) ─────────────────────────────
  - type: worker
    name: aiking-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: node apps/api/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: worker
      - key: QUEUE_DRIVER
        value: bullmq
      - key: JWT_SECRET
        fromService:
          name: aiking-api
          type: web
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        sync: false # Use the same production PostgreSQL connection URL as the API
      - key: REDIS_URL
        sync: false # Use the same production Redis connection URL as the API
      - key: CORS_ORIGINS
        sync: false # Required by shared production config; use the API frontend origin

  # ── Frontend Web Portal (Free Static Site) ────────────────────────────────────
  - type: web
    name: aiking-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm run build --workspace @aiking/shared && npm run build --workspace @aiking/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: aiking-api
          type: web
          property: host
